<div class="container my-5">
    <h1 class="text-center mb-4">Employee Management</h1>

    <!-- Form for Create/Update -->
    <div class="card mb-4">
      <div class="card-header">Add / Update Employee<                
         <button class="btn btn-sm btn-danger" (click)="openmodel()">Add</button>
        /div>
      <div class="card-body" #empform>
        <form id="employeeForm">
          <div class="row mb-3">
            <div class="col-md-6">
              <label for="firstName" class="form-label">First Name</label>
              <input type="text" class="form-control" id="firstName" placeholder="Enter First Name">
            </div>
            <div class="col-md-6">
              <label for="lastName" class="form-label">Last Name</label>
              <input type="text" class="form-control" id="lastName" placeholder="Enter Last Name">
            </div>
          </div>
          <div class="row mb-3">
            <div class="col-md-6">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control" id="email" placeholder="Enter Email">
            </div>
            <div class="col-md-6">
              <label for="contact" class="form-label">Contact</label>
              <input type="text" class="form-control" id="contact" placeholder="Enter Contact Number">
            </div>
          </div>
          <div class="row mb-3">
            <div class="col-md-6">
              <label for="city" class="form-label">City</label>
              <input type="text" class="form-control" id="city" placeholder="Enter City">
            </div>
            <div class="col-md-6">
              <label for="address" class="form-label">Address</label>
              <input type="text" class="form-control" id="address" placeholder="Enter Address">
            </div>
          </div>
          <div class="text-end">
            <button type="submit" class="btn btn-primary">Submit</button>
            <button type="reset" class="btn btn-secondary">Reset</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Table for Read/Delete -->
    <div class="card">
      <div class="card-header">Employee List</div>
      <div class="card-body">
        <table class="table table-bordered table-striped">
          <thead class="table-dark">
            <tr>
              <th>#</th>
              <th>First Name</th>
              <th>Last Name</th>
              <th>Email</th>
              <th>Contact</th>
              <th>City</th>
              <th>Address</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="employeeTable">
            <!-- Dynamic Rows -->
            <tr>
              <td>1</td>
              <td>Anitha</td>
              <td>Ganesan</td>
              <td>anigmail.com</td>
              <td>8220415078</td>
              <td>Minjur</td>
              <td>Chennai</td>
              <td>
                <button class="btn btn-sm btn-warning">Edit</button>
                <button class="btn btn-sm btn-danger">Delete</button>

              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
