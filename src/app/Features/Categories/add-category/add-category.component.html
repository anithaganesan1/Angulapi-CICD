<div class="container table-bordered">
    <h1 class="mt-3">add</h1>
    <form #form="ngForm" (ngSubmit)="onFormSubmit()">
<div class="mt-2">
<app-alert [alertType]= "'success'"  [message]="'hi from anitha'"></app-alert>
<div class="mt-3">
    
    <label class="form-label">category name</label>
    <input type="text" minlength="5" #categoryname="ngModel" id ="categoryname" class="form-control" name="categoryname" required [(ngModel)]="model.Name"> 
    <div>

        @if(categoryname?.errors?.['required']==true)
        {
            <span>this is required</span>

        }
        @if(categoryname?.errors?.['minlength'])
        {
            <span>Min % character required</span>

        }
    </div>
</div>
<div class="mt-3">
    
    <label class="form-label">category url handle</label>
    <input type="text" id ="categoryurlhandle" class="form-control" name="categoryurlhandle" [(ngModel)]="model.UrlHandle"> 
</div>
<div class="row">
    <div class="col-6">
        <button type="submit" class="btn btn-primary"> submit</button>
    </div>
    <div class="col-6">
        <button type="cancel" class="btn btn-primary"> Reset</button>
    </div>

 </div>

</div>

    </form>
    </div>
